name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: doctor_appointment
          POSTGRES_USER: doctor_app
          POSTGRES_PASSWORD: doctor_app_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U doctor_app -d doctor_appointment"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      TIME_ZONE: Asia/Tehran

      POSTGRES_DB: doctor_appointment
      POSTGRES_USER: doctor_app
      POSTGRES_PASSWORD: doctor_app_test_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DEFAULT_FROM_EMAIL: ci@doctor-appointment.local

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Django system check
        run: python manage.py check

      - name: Verify migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Ruff lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Check production settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-production-check-secret-key-with-more-than-fifty-characters
          CACHE_URL: redis://127.0.0.1:6379/0
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST: smtp.example.test
          SECURE_SSL_REDIRECT: "True"
          SESSION_COOKIE_SECURE: "True"
          CSRF_COOKIE_SECURE: "True"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          SECURE_HSTS_PRELOAD: "True"
        run: python manage.py check --deploy

      - name: Validate Compose contracts
        run: |
          cp .env.example .env
          cp .env.production.example .env.production
          docker compose config --quiet
          docker compose -f compose.production.yml config --quiet

      - name: Audit dependencies
        run: pip-audit -r requirements-dev.txt --progress-spinner off

      - name: Run tests with coverage
        run: |
          coverage run -m pytest -q
          coverage report --fail-under=95
