services:
  db:
    image: postgres:16-alpine
    container_name: doctor_appointment_prod_db
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - prod_network

  web:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    container_name: doctor_appointment_prod_web
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - prod_network

  nginx:
    image: nginx:alpine
    container_name: doctor_appointment_prod_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      - prod_network

volumes:
  postgres_data_prod:
  static_volume:
  media_volume:

networks:
  prod_network:
    driver: bridge
