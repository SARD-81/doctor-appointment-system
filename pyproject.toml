[project]
name = "doctor-appointment-system"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asgiref==3.12.1",
    "Django==5.2.17",
    "django-environ==0.14.0",
    "gunicorn==23.0.0",
    "packaging==26.3",
    "psycopg==3.3.5",
    "psycopg-binary==3.3.5",
    "redis==8.1.0",
    "sqlparse==0.6.0",
    "typing_extensions==4.16.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".venv",
    "migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.vercel.scripts]
build = "python scripts/vercel_build.py"
