<header class="site-header">
    <nav class="navbar navbar-expand-lg app-navbar" aria-label="ناوبری اصلی">
        <div class="container">
            <a class="navbar-brand app-brand" href="{% url 'home' %}">
                <span class="app-brand__mark"><i class="bi bi-heart-pulse-fill"></i></span>
                <span class="app-brand__text">
                    <strong>نوبت پزشک</strong>
                    <small>رزرو آنلاین و ساده</small>
                </span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="نمایش منو">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav mx-lg-auto mb-3 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">خانه</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.namespace == 'doctors' %}active{% endif %}" href="{% url 'doctors:list' %}">پزشکان</a>
                    </li>
                    <li class="nav-item"><span class="nav-link nav-link--disabled">تخصص‌ها</span></li>
                </ul>

                <div class="navbar-actions">
                    {% if user.is_authenticated %}
                        <span class="navbar-user"><i class="bi bi-person-circle"></i>{{ user.get_full_name|default:user.username }}</span>
                        <form method="post" action="{% url 'accounts:logout' %}" class="navbar-logout-form">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-ghost app-btn app-btn--sm">خروج</button>
                        </form>
                    {% else %}
                        <a class="btn btn-ghost app-btn app-btn--sm" href="{% url 'accounts:login' %}">ورود</a>
                        <a class="btn btn-primary app-btn app-btn--sm" href="{% url 'accounts:register' %}">ساخت حساب</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
</header>
